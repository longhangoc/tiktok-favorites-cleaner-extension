<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok Favorites Cleaner — Panel preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #000;
        color: #f1f1f2;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .topbar {
        height: 60px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 24px;
        border-bottom: 1px solid #1f1f24;
        background: #0b0b0d;
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .logo {
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -0.5px;
      }
      .logo span {
        color: #fe2c55;
      }
      .search {
        flex: 1;
        max-width: 380px;
        background: #1b1b1f;
        border-radius: 999px;
        padding: 9px 16px;
        color: #7d7d86;
        font-size: 13px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, #fe2c55, #7a1bff);
      }
      .layout {
        display: flex;
        max-width: 1100px;
        margin: 0 auto;
        gap: 40px;
        padding: 30px 24px 80px;
      }
      .profile {
        width: 260px;
        flex-shrink: 0;
        text-align: center;
      }
      .profile .bigavatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        margin: 0 auto 14px;
        background: linear-gradient(135deg, #fe2c55, #7a1bff);
      }
      .profile h2 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .profile .handle {
        color: #8a8a93;
        font-size: 13px;
      }
      .tabs {
        display: flex;
        gap: 22px;
        margin-top: 20px;
        border-bottom: 1px solid #1f1f24;
        justify-content: center;
      }
      .tab {
        padding: 10px 2px;
        font-size: 14px;
        font-weight: 700;
        color: #8a8a93;
        border-bottom: 2px solid transparent;
      }
      .tab.active {
        color: #f1f1f2;
        border-bottom-color: #f1f1f2;
      }
      .grid {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        align-content: start;
      }
      .card {
        position: relative;
        aspect-ratio: 3 / 4;
        border-radius: 6px;
        overflow: hidden;
        background: #1b1b1f;
      }
      .card .views {
        position: absolute;
        left: 8px;
        bottom: 8px;
        font-size: 12px;
        font-weight: 700;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      }
      .card .play {
        position: absolute;
        left: 8px;
        bottom: 26px;
        font-size: 11px;
        opacity: 0.9;
      }
      .g1 {
        background: linear-gradient(160deg, #2b2b3a, #12121a);
      }
      .g2 {
        background: linear-gradient(160deg, #3a2030, #160d14);
      }
      .g3 {
        background: linear-gradient(160deg, #1f3330, #0c1514);
      }
      .g4 {
        background: linear-gradient(160deg, #33301f, #14130b);
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="logo">TikTok<span>.</span></div>
      <div class="search">Tìm kiếm</div>
      <div class="avatar"></div>
    </div>

    <div class="layout">
      <div class="profile">
        <div class="bigavatar"></div>
        <h2>longhangoc</h2>
        <div class="handle">@longhangoc</div>
        <div class="tabs">
          <div class="tab">Video</div>
          <div class="tab active" id="favTab" data-e2e="favorites-tab" role="tab" aria-selected="true">
            Đã thích
          </div>
          <div class="tab">Đã lưu</div>
        </div>
      </div>

      <div class="grid" id="posts" role="tab" aria-selected="true">
        <span style="display: none">Posts 8</span>
        <div class="card g1" data-e2e="favorites-item">
          <span class="play">▶ 12.4K</span><span class="views">1,2tr</span>
        </div>
        <div class="card g2" data-e2e="favorites-item">
          <span class="play">▶ 8,1K</span><span class="views">845</span>
        </div>
        <div class="card g3" data-e2e="favorites-item">
          <span class="play">▶ 45K</span><span class="views">32,5N</span>
        </div>
        <div class="card g4" data-e2e="favorites-item">
          <span class="play">▶ 2,2K</span><span class="views">9,8</span>
        </div>
        <div class="card g1" data-e2e="favorites-item">
          <span class="play">▶ 67K</span><span class="views">5,4</span>
        </div>
        <div class="card g2" data-e2e="favorites-item">
          <span class="play">▶ 3,9K</span><span class="views">712</span>
        </div>
        <div class="card g3" data-e2e="favorites-item">
          <span class="play">▶ 21K</span><span class="views">1,1tr</span>
        </div>
        <div class="card g4" data-e2e="favorites-item">
          <span class="play">▶ 5,5K</span><span class="views">430</span>
        </div>
        <div data-e2e="favorites-item-list" style="display: none">
          <a href="/@longhangoc/video/7001">1</a>
          <a href="/@longhangoc/video/7002">2</a>
          <a href="/@longhangoc/video/7003">3</a>
          <a href="/@longhangoc/video/7004">4</a>
          <a href="/@longhangoc/video/7005">5</a>
          <a href="/@longhangoc/video/7006">6</a>
          <a href="/@longhangoc/video/7007">7</a>
          <a href="/@longhangoc/video/7008">8</a>
        </div>
      </div>
    </div>

    <script>
      // Chrome API giả để content.js chạy được ngoài extension.
      const listeners = [];
      window.chrome = {
        runtime: {
          lastError: null,
          onMessage: {
            addListener(fn) {
              listeners.push(fn);
            },
          },
          sendMessage(msg, cb) {
            if (msg && msg.action === "removeViaApi") {
              if (typeof cb === "function") cb({ ok: true, statusCode: 0 });
              return;
            }
            if (typeof cb === "function") cb(undefined);
          },
        },
        storage: {
          local: {
            get(_keys, cb) {
              cb({ tfcConfig: { method: "api", delayMs: 250 } });
            },
            set() {},
          },
        },
      };
      window.__emit = (msg) => {
        let responded;
        for (const fn of listeners) fn(msg, {}, (r) => (responded = r));
        return responded;
      };
      window.__confirm = () => {
        const host = document.getElementById("tfc-host");
        const btn = host && host.shadowRoot && host.shadowRoot.getElementById("tfcConfirm");
        if (btn) btn.click();
        return !!btn;
      };
    </script>
    <script src="../content.js"></script>
    <script>
      // Tự động mở bước "Xoá tất cả" để chụp màn hình xác nhận.
      setTimeout(() => {
        window.__emit({
          action: "tfc:start",
          config: { mode: "remove", method: "api", delayMs: 250 },
        });
      }, 400);
    </script>
  </body>
</html>
